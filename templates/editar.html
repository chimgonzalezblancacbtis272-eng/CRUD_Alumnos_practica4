{% extends 'base.html' %}


{% block contenido %}


<div class="row justify-content-center">

    <div class="col-lg-8">


        <section class="form-card p-4">


            <h1 class="section-title">

                Editar libro ✏️

            </h1>


            <p class="text-secondary">

                Puedes cambiar el nombre,
                la categoría o reemplazar el PDF.

            </p>



            <form

                method="post"

                action="{{ url_for(
                    'editar',
                    id=libro._id
                ) }}"

                enctype="multipart/form-data"

                class="row g-3"

            >


                <div class="col-12">

                    <label class="form-label">

                        Nombre del libro

                    </label>


                    <input

                        name="titulo"

                        class="form-control"

                        value="{{ libro.titulo }}"

                        required

                        maxlength="150"

                    >

                </div>



                <div class="col-12">

                    <label class="form-label">

                        Categoría

                    </label>


                    <select

                        name="categoria"

                        class="form-select"

                        required

                    >

                        {% for cat in categorias %}

                        <option

                            value="{{ cat }}"

                            {% if libro.categoria == cat %}
                                selected
                            {% endif %}

                        >

                            {{ cat }}

                        </option>

                        {% endfor %}

                    </select>

                </div>



                <div class="col-12">

                    <label class="form-label">

                        Reemplazar PDF
                        (opcional)

                    </label>


                    <input

                        type="file"

                        name="pdf"

                        class="form-control"

                        accept="application/pdf,.pdf"

                    >


                    <div class="form-text">

                        Si no seleccionas otro PDF,
                        se conserva el actual.

                    </div>

                </div>



                <div
                    class="col-12 d-flex
                           gap-2 flex-wrap"
                >


                    <button

                        class="btn btn-honey"

                        type="submit"

                    >

                        Guardar cambios

                    </button>



                    <a

                        class="btn btn-outline-dark"

                        target="_blank"

                        href="{{ url_for(
                            'ver_pdf',
                            id=libro._id
                        ) }}"

                    >

                        📖 Ver PDF actual

                    </a>



                    <a

                        class="btn btn-outline-secondary"

                        href="{{ url_for('inicio') }}"

                    >

                        Cancelar

                    </a>


                </div>


            </form>


        </section>


    </div>

</div>


{% endblock %}
